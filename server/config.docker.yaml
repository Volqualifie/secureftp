# 容器内使用的配置；数据库密码来自环境变量 FTP_DB_PASSWORD（见 docker-compose.yml）
server:
  host: 0.0.0.0
  port: 9443
  storage_root: /data/storage
  max_conn_per_ip: 10
  heartbeat_interval: 30
  idle_timeout: 90
  auth_timeout: 15
  login_max_failures: 5
  login_window: 300
  login_lockout: 300
  max_file_size: 4294967296
  max_concurrent_transfers: 4
  bandwidth_normal: 5242880     # 普通用户 5 MiB/s
  bandwidth_vip: 0              # VIP 用户不限速（0 = 不限速）
tls:
  cert: /certs/server-cert.pem
  key: /certs/server-key.pem
  ca: /certs/ca-cert.pem
  require_client_cert: false
database:
  host: mysql
  port: 3306
  user: ftpuser
  password: ""
  name: secureftp